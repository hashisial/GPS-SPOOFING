services:
  postgres:
    image: postgres:16
    container_name: gps-spoofing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gps_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

